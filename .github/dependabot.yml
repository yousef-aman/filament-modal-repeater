version: 2
updates:
  # Keep Composer (PHP) dependencies up to date
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Wait before proposing a freshly published release, so an obviously bad or
    # malicious version has time to be reported before it reaches this package.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7

  # Keep GitHub Actions workflow dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    # The github-actions ecosystem supports default-days only.
    cooldown:
      default-days: 7
